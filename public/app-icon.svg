<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a33" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- App Compass Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" stroke-dasharray="16 12" />
  <!-- Center Glow -->
  <circle cx="256" cy="256" r="100" fill="rgba(56,189,248,0.15)" filter="url(#shadow)" />
  <!-- Dynamic Plane & Compass Needle -->
  <path d="M256 96 L290 220 L414 256 L290 292 L256 416 L222 292 L98 256 L222 220 Z" fill="url(#planeGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="28" fill="#0284c7" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
